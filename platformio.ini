; ============================================================================
;  platformio.ini  —  Boxing Duel (SAMD21 / MKR WiFi 1010)
; ============================================================================
;  Two build environments share one codebase and select the board identity
;  through a compile-time macro (-D BOARD_ID=...), so there is a single main.cpp
;  instead of two near-duplicate sketches.
;
;    pio run -e boardA        # build for node A
;    pio run -e boardB -t upload   # build node B and flash
;
;  NOTE: WiFiNINA + FreeRTOS_SAMD21 dependency resolution on PlatformIO can need
;  manual pinning; versions below are a starting point, adjust when flashing real
;  hardware. See README "Build & Flash".
; ============================================================================

[platformio]
default_envs = boardA

[env]
platform  = atmelsam
board     = mkrwifi1010
framework  = arduino
monitor_speed = 115200

; Shared third-party libraries (the SPI+DMA WS2812B driver lives in lib/,
; so it is picked up automatically and is NOT listed here).
lib_deps =
    arduino-libraries/WiFiNINA @ ^1.8.14
    knolleary/PubSubClient @ ^2.8
    briscoetech/FreeRTOS_SAMD21 @ ^2.3.0

; ----- Node A -----
[env:boardA]
build_flags = -D BOARD_ID=0

; ----- Node B -----
[env:boardB]
build_flags = -D BOARD_ID=1
